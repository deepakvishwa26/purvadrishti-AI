# =============================================================================
# HIVE-Predict Synthetic Data Generation Configuration — V2
# =============================================================================
# This file controls all configurable parameters for the synthetic generator.
# All probability distributions are SYNTHETIC SIMULATION ASSUMPTIONS
# unless explicitly noted as derived from official public statistics.
# =============================================================================

# --- General Settings ---
general:
  num_cases: 10000
  seed: 42
  output_format: csv          # csv or parquet
  output_dir: data/output
  h3_resolution_primary: 8
  h3_resolution_dense: 9
  prediction_window_hours: 4  # 0-4 hour golden-hour window
  generator_version: "2.0.0"
  schema_version: "2.0.0"

# --- Fraud Type Distribution ---
# SYNTHETIC ASSUMPTION: These are simulation parameters, not official statistics.
fraud_types:
  DIGITAL_PAYMENT_FRAUD: 0.35
  INVESTMENT_FRAUD: 0.20
  DIGITAL_ARREST: 0.15
  PHISHING: 0.20
  OTHER: 0.10

# --- Fraud Amount Distribution (INR) ---
# Conditioned on fraud type. Uses lognormal(mu, sigma) parameters.
# SYNTHETIC ASSUMPTION: Right-skewed distributions calibrated for plausibility.
fraud_amount:
  DIGITAL_PAYMENT_FRAUD:
    distribution: lognormal
    mu: 10.0      # ~22,000 INR median
    sigma: 1.2
    min: 500
    max: 5000000
  INVESTMENT_FRAUD:
    distribution: lognormal
    mu: 11.5      # ~100,000 INR median
    sigma: 1.5
    min: 5000
    max: 50000000
  DIGITAL_ARREST:
    distribution: lognormal
    mu: 12.0      # ~160,000 INR median
    sigma: 1.0
    min: 10000
    max: 20000000
  PHISHING:
    distribution: lognormal
    mu: 9.5       # ~13,000 INR median
    sigma: 1.0
    min: 200
    max: 2000000
  OTHER:
    distribution: lognormal
    mu: 10.5      # ~36,000 INR median
    sigma: 1.3
    min: 500
    max: 10000000

# --- Behavioral Profile Distribution ---
# SYNTHETIC ASSUMPTION: Probabilities are simulation parameters.
# V2: cashout_probability decouples profile from deterministic outcome.
behavioral_profiles:
  FAST_CASHOUT:
    probability: 0.30
    cashout_probability: 0.95   # 5% chance of no cashout
    mule_chain_depth:
      min: 1
      max: 2
    hop_delay_seconds:
      min: 30
      max: 180
    cashout_delay_seconds:
      min: 300       # 5 min
      max: 3600      # 1 hour
    num_withdrawals:
      min: 1
      max: 1

  DEEP_MULE_CHAIN:
    probability: 0.15
    cashout_probability: 0.90   # 10% chance of no cashout
    mule_chain_depth:
      min: 4
      max: 8
    hop_delay_seconds:
      min: 60
      max: 600
    cashout_delay_seconds:
      min: 1800      # 30 min
      max: 10800     # 3 hours
    num_withdrawals:
      min: 1
      max: 2

  SLOW_CASHOUT:
    probability: 0.15
    cashout_probability: 0.92   # 8% chance of no cashout
    mule_chain_depth:
      min: 2
      max: 4
    hop_delay_seconds:
      min: 300
      max: 1800
    cashout_delay_seconds:
      min: 7200      # 2 hours
      max: 14400     # 4 hours
    num_withdrawals:
      min: 1
      max: 1

  NO_CASHOUT:
    probability: 0.15
    cashout_probability: 0.08   # 8% chance of SURPRISE cashout
    mule_chain_depth:
      min: 1
      max: 5
    hop_delay_seconds:
      min: 60
      max: 600
    cashout_delay_seconds:
      min: 900       # 15 min (used if surprise cashout triggers)
      max: 7200      # 2 hours
    num_withdrawals:
      min: 0
      max: 0

  MULTIPLE_CASHOUT:
    probability: 0.15
    cashout_probability: 0.93   # 7% chance of no cashout
    mule_chain_depth:
      min: 2
      max: 5
    hop_delay_seconds:
      min: 60
      max: 300
    cashout_delay_seconds:
      min: 900       # 15 min
      max: 7200      # 2 hours
    num_withdrawals:
      min: 2
      max: 4

  COORDINATED_CASE:
    probability: 0.10
    cashout_probability: 0.94   # 6% chance of no cashout
    mule_chain_depth:
      min: 2
      max: 4
    hop_delay_seconds:
      min: 60
      max: 300
    cashout_delay_seconds:
      min: 600       # 10 min
      max: 5400      # 1.5 hours
    num_withdrawals:
      min: 1
      max: 2
    coordination_group_size:
      min: 2
      max: 5

# --- Temporal Parameters ---
temporal:
  # Date range for generated complaints
  start_date: "2024-01-01"
  end_date: "2024-12-31"
  # Complaint registration delay after incident (seconds)
  registration_delay:
    min: 60        # 1 min
    max: 7200      # 2 hours
  # Time-of-day distribution weights (hour buckets)
  # SYNTHETIC ASSUMPTION: Fraud tends to peak evening/night
  hourly_weights:

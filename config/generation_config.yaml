# --- Financial Parameters ---
financial:
  # Friction per mule hop (percentage of amount lost/retained)
  mule_hop_friction:
    min: 0.02    # 2% minimum loss per hop
    max: 0.10    # 10% maximum loss per hop
  # Withdrawal amount as fraction of available funds at cashout account
  withdrawal_fraction:
    min: 0.50    # withdraw at least 50%
    max: 0.95    # withdraw at most 95%
  # Per-ATM withdrawal limit (INR)
  atm_withdrawal_limit: 50000
  # Currency
  currency: INR

# --- Bank Reference ---
banks:
  - bank_id: BANK001
    name: "Synthetic National Bank"
  - bank_id: BANK002
    name: "Synthetic State Bank"
  - bank_id: BANK003
    name: "Synthetic Union Bank"
  - bank_id: BANK004
    name: "Synthetic Payment Bank"
  - bank_id: BANK005
    name: "Synthetic Cooperative Bank"
  - bank_id: BANK006
    name: "Synthetic Private Bank"
  - bank_id: BANK007
    name: "Synthetic Rural Bank"
  - bank_id: BANK008
    name: "Synthetic Digital Bank"

# --- Clustering Parameters (V2: rolling window) ---
clustering:
  method: "rolling_window"     # "rolling_window" prevents temporal leakage
  window_days: 30              # Only use complaints from the last 30 days
  dbscan_eps_km: 10.0          # spatial epsilon in km
  dbscan_min_samples: 3
  temporal_window_hours: 24
  spatial_weight: 0.6
  temporal_weight: 0.4

# --- Feature Engineering ---
features:
  # Historical hotspot density parameters
  hotspot_bandwidth_km: 5.0
  hotspot_spatial_rings: 6     # V2: increased from 3 to 6 for better coverage
  # ATM density radius (km)
  atm_density_radius_km: 2.0
  # Amount velocity minimum time denominator (seconds)
  amount_velocity_min_time_seconds: 60

# --- V2: Mule Account Pool ---
mule_pool:
  pool_size: 5000              # Pre-created mule accounts
  reuse_probability: 0.35      # 35% chance of reusing existing mule
  max_reuse_per_account: 8     # Max complaints per mule account

# --- V2: Historical Seed Events ---
historical_seed:
  num_seed_withdrawals: 50000  # Synthetic historical withdrawals before data window
  seed_window_days: 180        # Historical events go back 180 days before start_date
  urban_weight: 0.75           # Fraction of seed events near urban centers

# --- V2: ATM Selection Diversity ---
atm_selection:
  victim_proximity_weight: 0.40   # 40% weight for victim-nearest
  mule_drift_weight: 0.45         # 45% weight for mule-chain-drifted location
  random_selection_weight: 0.15   # 15% fully random ATM
  mule_chain_drift_km: 50         # Geographic drift per mule hop (max)

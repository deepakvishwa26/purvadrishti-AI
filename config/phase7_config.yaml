# =============================================================================
# HIVE-Predict Phase 7 — XGBoost Learning-to-Rank Config
# =============================================================================

general:
  seed: 42
  output_dir: data/output/phase7
  source_dir: data/output/phase6_v2

model:
  objective: rank:ndcg
  eval_metric: ndcg@5-
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 5
  subsample: 0.8
  colsample_bytree: 0.8
  gamma: 0.1
  reg_alpha: 0.0
  reg_lambda: 1.0
  n_estimators: 1000
  early_stopping_rounds: 50
  verbosity: 1
  device: cpu
  seed: 42

# Features excluded from XGBoost (identifiers / targets / metadata)
excluded_columns:
  - complaint_id
  - candidate_h3_cell
  - relevance
  - split
  - positive_source
  - victim_h3_res8
  - feature_cutoff_timestamp

# Expected model features (22 total)
expected_feature_count: 22

evaluation:
  k_values: [1, 3, 5, 10]
  primary_metric: ndcg5
  hard_negative_km_threshold: 100
